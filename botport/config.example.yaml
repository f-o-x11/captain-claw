# BotPort configuration — the hub that connects Flight Decks.
#
#   Agent → Flight Deck A → BotPort → Flight Deck B → agent
#
# Copy to ~/.botport/config.yaml (chmod 600 — it holds secrets) and run
#   botport check -c ~/.botport/config.yaml
#   botport -c ~/.botport/config.yaml
# Lookup without -c: $BOTPORT_CONFIG, ./botport.yaml, ./config.yaml (only if
# it is a BotPort config), ~/.botport/config.yaml. Every value can also be set
# by environment, e.g. BOTPORT_SERVER__PORT=23180, BOTPORT_AUTH__ENABLED=true
# (scripts/botport-tmux.sh also reads such lines from ~/.botport/env).
# Full guide: docs/botport-deployment.md

server:
  host: "0.0.0.0"            # 127.0.0.1 when only a local reverse proxy reaches it
  port: 23180
  dashboard_enabled: true
  # Bearer token for the dashboard + REST API. Without one (and with auth on)
  # they answer only requests from this machine. Generate: openssl rand -hex 24
  admin_token: ""
  # true when a reverse proxy / tunnel on this host (Caddy, nginx, cloudflared)
  # carries the traffic; then bind host to 127.0.0.1 so only the proxy reaches it.
  behind_proxy: false
  trusted_proxies: ["127.0.0.1", "::1"]   # whose X-Forwarded-For is believed
  # Serve wss:// directly instead (leave empty behind a TLS proxy).
  tls_cert: ""
  tls_key: ""
  ws_heartbeat_seconds: 25   # keeps NAT mappings alive, detects dead sockets
  data_dir: ""               # database + swarm files; empty = ~/.botport
  cors_origins: []           # browser origins allowed to call the REST API
  swarm_workspace_mb: 1024   # swarm file uploads (legacy agents): per-swarm cap
  min_free_disk_mb: 512      # never fill the disk (SD card) past this

auth:
  enabled: true
  # Flight Decks are easiest to add on the dashboard (Decks → Add Flight
  # Deck): the hub keeps those keys in its database and takes them at once,
  # without a restart, so this list may stay empty.
  # Keys here work too (and need a restart when changed): one entry per Flight
  # Deck (and per legacy agent). `instance` binds the name: a deck connecting
  # with this key IS that deck (a deck's key must have one), and an agent
  # using it is registered under that name.
  # Generate an entry with:  botport gen-key <deck-name>
  keys:
    # - instance: "vps1"
    #   key: "vps1-xxxxxxxx"
    #   secret: "<32+ random characters>"
    # - instance: "vps2"
    #   key: "vps2-xxxxxxxx"
    #   secret: "<32+ random characters>"
    # - instance: "pi"
    #   key: "pi-xxxxxxxx"
    #   secret: "<32+ random characters>"
  max_failures_per_minute: 10  # per address + key, then blocked for block_seconds
  block_seconds: 300

concerns:
  idle_timeout_seconds: 600      # no progress for this long → the request fails
  default_timeout_seconds: 600   # when a request names no timeout
  max_timeout_seconds: 3600
  reconnect_grace_seconds: 90    # a deck that drops mid-task may come back this long
  result_retention_seconds: 900  # results for an offline requester wait this long
  max_follow_ups: 20
  max_concurrent_per_instance: 10  # cap on what any deck/agent may run at once (each also sets its own)

# Routing: requests to Agent@deck go straight there. Unaddressed ones (legacy
# agents) try tags → LLM (if enabled) → least loaded; nothing to configure.

logging:
  level: "INFO"
  file: ""                 # e.g. ~/.botport/botport.log (rotated)
  file_max_mb: 10
  file_backups: 5
  color: "auto"            # auto | always | never
  retention_days: 30       # finished requests kept in the database

# LLM-assisted routing for unaddressed requests (needs: pip install 'botport[llm]').
llm:
  enabled: false
  model: "gemini/gemini-2.0-flash"   # litellm provider/model
  base_url: ""
  api_key: ""                        # or the provider's env var
  temperature: 0.1
  timeout: 30
